name: Nalco PDF Downloader

on:
  workflow_dispatch: {}
  schedule:
    # 09:00, 12:00, 15:00, 18:00 IST = 03:30, 06:30, 09:30, 12:30 UTC
    - cron: "30 3,6,9,12 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          # NALCO's legacy HTTPS certificate chain is rejected by the
          # GitHub-hosted runner. Patch the two NALCO requests at runtime so
          # this fix works even if nalco_scraper.py itself has not changed.
          python - <<'PY'
          from pathlib import Path

          p = Path("nalco_scraper.py")
          s = p.read_text(encoding="utf-8")

          old_page = "session.get(url, timeout=60)"
          new_page = "session.get(url, timeout=60, verify=False)"
          old_pdf = "session.get(url, headers=headers, timeout=60, stream=True, allow_redirects=True)"
          new_pdf = "session.get(url, headers=headers, timeout=60, stream=True, allow_redirects=True, verify=False)"

          changed = False
          if old_page in s:
              s = s.replace(old_page, new_page)
              changed = True
          if old_pdf in s:
              s = s.replace(old_pdf, new_pdf)
              changed = True

          if not changed:
              print("NALCO TLS patch already present or source pattern changed; continuing.")
          else:
              p.write_text(s, encoding="utf-8")
              print("Applied NALCO TLS fallback to page and PDF requests.")
          PY

          python nalco_scraper.py

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nalco-output
          path: |
            pdfs/*
            data/*

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update Nalco PDF ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"

            # Another scheduled/manual run can update main while this job is
            # running. Rebase our generated commit on the latest remote main
            # before pushing, instead of failing with "fetch first".
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "Push succeeded on attempt ${attempt}."
                  exit 0
                fi
              fi
              git rebase --abort || true
              sleep 2
            done

            echo "Could not push after 3 attempts." >&2
            exit 1
          else
            echo "No changes to commit."
          fi
